name: Release Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout Release Ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Validate Release Tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${{ github.event.inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [ "$release_tag" != "v${package_version}" ]; then
            echo "Release tag ${release_tag} does not match package version ${package_version}."
            exit 1
          fi
          echo "ref=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: validate-release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies (with retry)
        shell: bash
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "npm ci attempt ${attempt}/${max_attempts}"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "npm ci failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "npm ci failed (transient network likely). Retrying in 15s..."
            sleep 15
          done

      - name: Verify
        run: npm run verify

      - name: Build macOS Artifacts
        run: npm run package:mac -- --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  build-windows:
    needs: validate-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies (with retry)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "npm ci attempt $attempt/$maxAttempts"
            try {
              npm ci
              exit 0
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              Write-Host "npm ci failed (transient network likely). Retrying in 15s..."
              Start-Sleep -Seconds 15
            }
          }

      - name: Verify
        run: npm run verify

      - name: Build Windows Artifacts
        run: npm run package:win -- --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

  build-linux:
    needs: validate-release
    uses: ./.github/workflows/linux-package.yml
    with:
      ref: ${{ needs.validate-release.outputs.ref }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [validate-release, build-macos, build-windows, build-linux]

    steps:
      - name: Checkout Release Notes
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.ref }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: release-artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release-artifacts/windows

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-core-x64
          path: release-artifacts/linux-x64

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-core-arm64
          path: release-artifacts/linux-arm64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: ${{ needs.validate-release.outputs.tag }}
          body_path: .github/release-notes.md
          files: |
            release-artifacts/macos/*
            release-artifacts/windows/*
            release-artifacts/linux-x64/*
            release-artifacts/linux-arm64/*
