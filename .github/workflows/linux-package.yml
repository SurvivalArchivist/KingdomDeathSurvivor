name: Linux Package

on:
  workflow_dispatch:

jobs:
  package-linux:
    name: Core packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            package_script: package:linux:x64
            unpacked_dir: linux-unpacked
            deb_arch: amd64
            rpm_arch: x86_64
            elf_machine: Advanced Micro Devices X86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            package_script: package:linux:arm64
            unpacked_dir: linux-arm64-unpacked
            deb_arch: arm64
            rpm_arch: aarch64
            elf_machine: AArch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Record Build Environment
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          getconf PAGESIZE
          node --version
          npm --version

      - name: Install Dependencies (with retry)
        shell: bash
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "npm ci attempt ${attempt}/${max_attempts}"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "npm ci failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "npm ci failed (transient network likely). Retrying in 15s..."
            sleep 15
          done

      - name: Verify
        run: npm run verify

      - name: Install Linux Packaging Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file libatspi2.0-0 libcrypt1 libgtk-3-0 libnotify4 libnss3 libsecret-1-0 libuuid1 libxss1 libxtst6 rpm xdg-utils xvfb

      - name: Build Linux Core Artifacts
        run: npm run ${{ matrix.package_script }} -- --publish never

      - name: Validate Linux Core Artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(release/*-linux-${{ matrix.arch }}.tar.gz)
          debs=(release/*.deb)
          rpms=(release/*.rpm)

          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one ${{ matrix.arch }} tarball; found ${#tarballs[@]}"
            exit 1
          fi
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one ${{ matrix.arch }} DEB; found ${#debs[@]}"
            exit 1
          fi
          if [[ ${#rpms[@]} -ne 1 ]]; then
            echo "Expected exactly one ${{ matrix.arch }} RPM; found ${#rpms[@]}"
            exit 1
          fi

          deb_arch="$(dpkg-deb --field "${debs[0]}" Architecture)"
          rpm_arch="$(rpm -qp --queryformat '%{ARCH}' "${rpms[0]}")"
          if [[ "$deb_arch" != "${{ matrix.deb_arch }}" ]]; then
            echo "Unexpected DEB architecture: $deb_arch"
            exit 1
          fi
          if [[ "$rpm_arch" != "${{ matrix.rpm_arch }}" ]]; then
            echo "Unexpected RPM architecture: $rpm_arch"
            exit 1
          fi

          executable="release/${{ matrix.unpacked_dir }}/kingdom-death-survivors"
          if [[ ! -x "$executable" ]]; then
            echo "Packaged executable is missing or not executable: $executable"
            exit 1
          fi
          if ! readelf -h "$executable" | grep -Eq "Machine:[[:space:]]+${{ matrix.elf_machine }}$"; then
            echo "Packaged executable has the wrong ELF architecture"
            readelf -h "$executable"
            exit 1
          fi

          file "$executable"
          readelf -lW "$executable" | grep -E 'Type|LOAD'
          sha256sum "${tarballs[0]}" "${debs[0]}" "${rpms[0]}"
          echo "Linux ${{ matrix.arch }} core artifact validation passed."

      - name: Smoke Test Packaged Application
        shell: bash
        run: |
          xvfb-run -a npm run smoke:linux:packaged -- \
            "release/${{ matrix.unpacked_dir }}/kingdom-death-survivors" \
            --no-sandbox

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-core-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
          if-no-files-found: error
